name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request /health
        run: |
          curl --max-time 90 --retry 3 --retry-delay 10 --fail -sS \
            -o /dev/null -w "HTTP status: %{http_code}\n" \
            https://prepwise-api.onrender.com/health
